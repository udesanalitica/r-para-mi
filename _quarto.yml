project:
  type: book
  execute-dir: project
  output-dir: docs

lang: es

toc-title: "Tabla de contenido"

book:
  title: "R para Mí"
  subtitle: "Diseño de experimentos con R aplicado a la microbiología industrial"
  author:
    - "Fredy Alejandro Ortiz Meneses"
    - "Miguel Oswaldo Pérez Pulido"
    - "Francisco Javier León"
  date: "2025-05-05"
  cover-image: cover.png
  site-url: "https://udesanalitica.github.io/r-para-mi/"
  repo-url: "https://github.com/udesanalitica/r-para-mi"
  repo-branch: main
  repo-actions: [edit, issue, source]
  page-navigation: true
  search: true
  downloads: [pdf, epub]
  chapters:
    - index.qmd
    - autores.qmd
    - agradecimientos.qmd
    - intro.qmd
    - Chapter_01.qmd
    - Chapter_02.qmd
    - Chapter_03.qmd
    - Chapter_04.qmd
    - Chapter_05.qmd
    - Chapter_06.qmd
    - experiencia-uso.qmd
    - desarrollo-recurso.qmd
    - contribuir.qmd
    - licencia.qmd
    - references.qmd
  page-footer:
    left: "© 2025 Universidad de Santander (UDES) · Acceso gratuito · Licenciamiento en formalización"
    right: "Publicado con Quarto y GitHub Pages"

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-copy: true
    smooth-scroll: true
    toc-depth: 3

  pdf:
    documentclass: report
    pdf-engine: xelatex
    toc: true
    number-sections: true

  epub:
    cover-image: cover.png

execute:
  freeze: auto
  warning: false
  message: false

editor: visual